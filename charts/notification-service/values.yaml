appName: notification-service
namespace: finance
team: notifications
environment: production
component: service
partOf: bny-platform

iamRoleArn: "arn:aws:iam::123456789012:role/production-notification-pod-role"
vaultRole: notification-service

image:
  repository: 123456789012.dkr.ecr.us-east-1.amazonaws.com/notification-service
  tag: "1.2.0"
  pullPolicy: Always

replicas: 2
containerPort: 8081
metricsPort: "9091"
healthCheckPath: /health
readOnlyRootFilesystem: true

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

readinessProbe:
  initialDelaySeconds: 10
  periodSeconds: 5
  failureThreshold: 3

livenessProbe:
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 3

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPU: 70
  targetMemory: 80
  scaleUpStabilization: 60
  scaleDownStabilization: 300
  scaleUpPods: 2
  scaleDownPods: 1

vpa:
  enabled: false

pdb:
  minAvailable: 1

service:
  port: 80

ingress:
  enabled: false

networkPolicy:
  enabled: true
  additionalIngress:
    - from:
        - podSelector:
            matchLabels:
              app: payment-api
      ports:
        - protocol: TCP
          port: 8081
  additionalEgress:
    - ports:
        - port: 587
          protocol: TCP

config:
  logLevel: INFO
  extraData:
    MAX_RETRIES: "3"
    NOTIFICATION_BATCH_SIZE: "100"

env:
  APP_NAME: notification-service
  REGION: us-east-1

rbac:
  rules:
    - apiGroups: [""]
      resources: ["configmaps"]
      verbs: ["get", "list", "watch"]
  clusterRole: ""

# KEDA event-driven autoscaling (replaces HPA when enabled=true)
# SQS queue depth is a better scaling signal than CPU for notifications
keda:
  enabled: false       # Set true to replace HPA with KEDA ScaledObject
  minReplicas: 0       # Scale to zero when queue empty (cost saving)
  maxReplicas: 20
  pollingInterval: 30
  cooldownPeriod: 300
  triggers:
    - type: aws-sqs-queue
      metadata:
        queueURL: "https://sqs.us-east-1.amazonaws.com/123456789012/bny-notifications"
        queueLength: "10"
        awsRegion: us-east-1
        identityOwner: pod
