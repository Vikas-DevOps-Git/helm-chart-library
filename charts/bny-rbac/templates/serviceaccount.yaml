apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.appName }}-sa
  namespace: {{ .Values.namespace | default "default" }}
  labels:
    app: {{ .Values.appName }}
    app.kubernetes.io/name: {{ .Values.appName }}
    app.kubernetes.io/managed-by: Helm
    bny.com/team: {{ .Values.team | default "platform" }}
  annotations:
    # OIDC pod identity — pod assumes IAM role without static credentials
    eks.amazonaws.com/role-arn: {{ .Values.iamRoleArn | default "" | quote }}
    # Vault K8s auth — Vault verifies this SA token
    vault.hashicorp.com/role: {{ .Values.vaultRole | default .Values.appName | quote }}
    {{- if .Values.rbac.serviceAccountAnnotations }}
    {{- toYaml .Values.rbac.serviceAccountAnnotations | nindent 4 }}
    {{- end }}
automountServiceAccountToken: true
