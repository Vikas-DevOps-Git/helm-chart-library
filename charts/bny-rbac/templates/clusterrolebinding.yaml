{{- if .Values.rbac.clusterRole }}
# ClusterRoleBinding — used only for platform-level services (monitoring, logging)
# Application pods NEVER get ClusterRole bindings
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.appName }}-cluster-rb
  labels:
    app: {{ .Values.appName }}
    app.kubernetes.io/managed-by: Helm
subjects:
  - kind: ServiceAccount
    name: {{ .Values.appName }}-sa
    namespace: {{ .Values.namespace | default "default" }}
roleRef:
  kind: ClusterRole
  name: {{ .Values.rbac.clusterRole }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
